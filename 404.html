<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4Bros Beach Volley — Vôlei, resenha e respeito</title>
    <meta name="description" content="Safe space de vôlei de praia em Porto Alegre. Comunidade Bear e LGBT+, jogo recreativo, acolhimento acima da vitória." />
    <meta name="author" content="4Bros Beach Volley" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#140f17" />
    <!-- Tema escuro oficial antes do React subir (sem piscar claro). Mesma
         chave e mesma regra de src/lib/tema.ts. -->
    <script>
      (function () {
        try {
          // Halloween ligado (mesma regra de temporadaDatas.ts + botão do topo):
          // não mexe, o tema da temporada cuida das cores.
          var d = new Date();
          var halloween = (d.getMonth() === 9 || (d.getMonth() === 10 && d.getDate() <= 2))
            && localStorage.getItem("tema-halloween-desligado") !== "1";
          if (halloween) return;
          var p = localStorage.getItem("4bros:tema");
          var escuro = p === "escuro" || (p !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) {
            document.documentElement.classList.add("dark", "tema-escuro");
            document.querySelector('meta[name="theme-color"]').content = "#3d2c1f";
          }
        } catch (e) {}
      })();
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <body>
    <!--
      Casca de carregamento: aparece na hora, antes do bundle terminar de
      baixar/rodar, pra nunca ficar uma tela branca seca -- vale tanto pra
      quem clica dentro do app quanto pra quem abre um link direto (que no
      GitHub Pages passa pelo 404.html, uma cópia deste mesmo arquivo). Some
      sozinha assim que o React troca o conteúdo de #root.
    -->
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0b13;">
        <img src="/icons/icon-192-halloween.png" alt="" width="72" height="72"
             style="opacity:.9;animation:boot-pulse 1.3s ease-in-out infinite;" />
      </div>
    </div>
    <style>
      @keyframes boot-pulse {
        0%, 100% { opacity: .55; transform: scale(.92); }
        50%      { opacity: 1;   transform: scale(1); }
      }
    </style>

    <script>
      // Só em produção: com o dev server ligado, um service worker ativo
      // serve arquivo velho e faz você debugar um bug que já corrigiu.
      if ("serviceWorker" in navigator && location.hostname !== "localhost") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
